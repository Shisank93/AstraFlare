version: '3.8'

services:
  database:
    image: postgis/postgis:15-3.3
    container_name: astraflare-postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astraflare_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astraflare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: astraflare-backend
    restart: always
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-astraflare_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-astraflare}
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./data_pipeline:/app/data_pipeline

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astraflare-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
